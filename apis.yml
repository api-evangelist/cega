aid: cega
name: Cega
description: 'Cega is a decentralized exotic derivatives protocol building on-chain structured products
  for investors: exotic options such as Fixed Coupon Notes (pure options and bond + options) and Dual
  Currency Swaps that generate yield with built-in downside protection. Cega is live on Ethereum Mainnet
  and Arbitrum One (EVM) and on Solana, and exposes its protocol to developers through first-party
  TypeScript SDKs on npm (@cega-fi) plus a GraphQL subgraph rather than a hosted REST API. Backed by
  Pantera Capital and surfaced into the API Evangelist network from its VC portfolio.'
